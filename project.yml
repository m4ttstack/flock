name: Paddock
options:
  bundleIdPrefix: dev.mattstack
  deploymentTarget: { macOS: "15.0" }
settings:
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
targets:
  PaddockCore:
    type: framework
    platform: macOS
    sources: [Sources/PaddockCore]
    dependencies:
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreVideo.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Paddock:
    type: application
    platform: macOS
    sources: [Sources/Paddock]
    dependencies: [{ target: PaddockCore }]
    info:
      path: Sources/Paddock/Info.plist
      properties:
        # Evaluated by AppKit at the earliest point in launch, before any of
        # our own code (the app delegate included) runs -- a stale window-
        # restoration identity cached outside the app (an
        # `AppWindowsController`-owned entry keyed by bundle id, survives
        # every per-app default/preference reset) otherwise makes every
        # launch's automatic window-restoration attempt resolve to a null
        # window with no error and no fallback to a fresh default window.
        # `.restorationBehavior(.disabled)` on the scene and
        # `NSApplicationDelegate.applicationSupportsSecureRestorableState`
        # both run too late in the launch sequence to prevent this specific
        # attempt (confirmed empirically: neither stopped it, and an
        # `NSLog` inside the delegate method never fired before the
        # restoration attempt logged). This Info.plist key is read before
        # either of those.
        NSApplicationSupportsSecureRestorableState: NO
  PaddockCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PaddockCoreTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies: [{ target: PaddockCore }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PaddockUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/PaddockUITests]
    dependencies: [{ target: Paddock }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # The app's views compiled into a hostless test bundle, so the window chrome
  # renders offscreen from fixture data without launching Paddock or opening a
  # herdr connection. The Paddock scheme builds it for testing, so a break in
  # it fails the core test run, but runs it only from its own scheme.
  PaddockChromeRender:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Paddock
        excludes:
          - main.swift
          - PaddockApp.swift
          - Info.plist
          - Resources
      - Tests/PaddockChromeRender
    dependencies:
      - target: PaddockCore
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Paddock:
    build:
      targets:
        Paddock: all
        PaddockCore: all
        PaddockChromeRender: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PaddockCoreTests, PaddockUITests]
  PaddockChromeRender:
    build:
      targets:
        PaddockChromeRender: [test]
    test:
      config: Debug
      targets: [PaddockChromeRender]
