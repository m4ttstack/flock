name: Paddock
options:
  bundleIdPrefix: dev.mattstack
  deploymentTarget: { macOS: "15.0" }
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Vendor/GhosttyKit.xcframework is built `-Dxcframework-target=native`
      # (Scripts/libghostty.sh), so it carries only the architecture of the
      # machine that built it. Release's usual universal build has nothing to
      # link the other slice against.
      ONLY_ACTIVE_ARCH: YES
      # Ad-hoc by default so a machine with no Developer ID still produces a
      # launchable bundle; Scripts/release-build.sh overrides both of these on
      # the xcodebuild command line when a real identity is resolved.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: YES
      # Xcode's injected base entitlements carry `get-task-allow`, which
      # notarization refuses. Paddock ships no entitlements of its own, so
      # turning the injection off leaves the release binary with none at all.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  PaddockCore:
    type: framework
    platform: macOS
    sources: [Sources/PaddockCore]
    dependencies:
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreVideo.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Paddock:
    type: application
    platform: macOS
    sources: [Sources/Paddock]
    dependencies: [{ target: PaddockCore }]
    info:
      path: Sources/Paddock/Info.plist
      properties:
        # Evaluated by AppKit at the earliest point in launch, before any of
        # our own code (the app delegate included) runs -- a stale window-
        # restoration identity cached outside the app (an
        # `AppWindowsController`-owned entry keyed by bundle id, survives
        # every per-app default/preference reset) otherwise makes every
        # launch's automatic window-restoration attempt resolve to a null
        # window with no error and no fallback to a fresh default window.
        # `.restorationBehavior(.disabled)` on the scene and
        # `NSApplicationDelegate.applicationSupportsSecureRestorableState`
        # both run too late in the launch sequence to prevent this specific
        # attempt (confirmed empirically: neither stopped it, and an
        # `NSLog` inside the delegate method never fired before the
        # restoration attempt logged). This Info.plist key is read before
        # either of those.
        NSApplicationSupportsSecureRestorableState: NO
  PaddockCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PaddockCoreTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies: [{ target: PaddockCore }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  PaddockUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      # Support/bin belongs to Scripts/e2e.sh, which runs outside the
      # sandboxed test runner; nothing in the bundle shells out to it.
      - path: Tests/PaddockUITests
        excludes: [Support/bin]
    dependencies: [{ target: Paddock }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # The app's views compiled into a hostless test bundle, so the window chrome
  # renders offscreen from fixture data without launching Paddock or opening a
  # herdr connection. The Paddock scheme builds it for testing, so a break in
  # it fails the core test run, but runs it only from its own scheme.
  PaddockChromeRender:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Paddock
        excludes:
          - main.swift
          - PaddockApp.swift
          - Info.plist
          - Resources
      - path: Sources/Paddock/Resources/Fonts
        buildPhase: resources
      - Tests/PaddockChromeRender
    dependencies:
      - target: PaddockCore
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Paddock:
    build:
      targets:
        Paddock: all
        PaddockCore: all
        PaddockChromeRender: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PaddockCoreTests, PaddockUITests]
    archive:
      config: Release
  PaddockChromeRender:
    build:
      targets:
        PaddockChromeRender: [test]
    test:
      config: Debug
      targets: [PaddockChromeRender]
