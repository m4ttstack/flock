name: Repo purity

# flock is headed for a public repo, so Sparkle can serve its appcast and its
# builds from GitHub Releases without a token. This gate keeps employer,
# customer, and internal-system references out of the tracked tree on every PR
# and every push to main.
#
# It exists because the bar was crossed once already in this estate: rt was
# public for six months carrying an internal GitLab host, real ticket ids, and
# two named customers in test fixtures. A word list cannot certify what it was
# never told to look for -- extend Scripts/repo-purity.sh when a new term
# appears, rather than assuming the list is complete.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  purity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No employer or domain references in the tracked tree
        run: Scripts/repo-purity.sh
